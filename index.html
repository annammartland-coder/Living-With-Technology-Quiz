<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVEVA Wellbeing Network | Living With Technology</title>
    ">
</head>

<body>

    <div class="card">

        <div class="header">
            <img src="AVEVA-logo.png"
                 alt="AVEVA"
                 class="aveva-logo">
        </div>

        <img src="Wellbeing-Network-Logo.png"
             alt="Wellbeing Network"
             class="wellbeing-logo">

        <div class="title-section">
            <h1>🎧 Living With Technology</h1>
            <p>Can you recognise these iconic technology sounds?</p>
        </div>

        <div class="instructions">
            <h2>How to Play</h2>
            <ul>
                <li>Press <strong>Play Sound</strong></li>
                <li>Select the answer you think is correct</li>
                <li>Complete all questions</li>
                <li>See your score at the end</li>
            </ul>
        </div>

        <div class="quiz-section">

            <p id="progress"></p>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <button id="playBtn" class="play-button">
                🔊 Play Sound
            </button>

            <div id="options"></div>

            <button id="nextBtn" class="submit-button">
                Submit Answer
            </button>

            <div id="feedback"></div>

        </div>

        <div class="footer">
            AVEVA Wellbeing Network
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
